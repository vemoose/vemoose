<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Perfect Payroll product showcase">
  <defs>
    <linearGradient id="pp-bg" x1="120" y1="0" x2="680" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8f2ff"/>
      <stop offset="0.45" stop-color="#c9dcfb"/>
      <stop offset="1" stop-color="#9ec0f4"/>
    </linearGradient>
    <radialGradient id="pp-glow-a" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 120) scale(220)">
      <stop stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-glow-b" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 400) scale(200)">
      <stop stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pp-logo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="pp-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a5f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#pp-bg)"/>
  <rect width="800" height="500" fill="url(#pp-glow-a)"/>
  <rect width="800" height="500" fill="url(#pp-glow-b)"/>

  <!-- Ambient sparkles -->
  <g stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
    <path d="M698 78l2.2 6.2 6.2 2.2-6.2 2.2-2.2 6.2-2.2-6.2-6.2-2.2 6.2-2.2z" fill="none"/>
    <path d="M88 92v5M90.5 94.5h-5" opacity="0.5"/>
    <circle cx="52" cy="168" r="2" fill="#2563eb" stroke="none" opacity="0.4"/>
    <circle cx="728" cy="388" r="2.5" fill="#2563eb" stroke="none" opacity="0.35"/>
  </g>

  <!-- Brand lockup -->
  <rect x="48" y="44" width="40" height="40" rx="11" fill="url(#pp-logo)"/>
  <g transform="translate(59 55)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" transform="scale(0.85)"/>
    <path d="M20 2v4M22 4h-4" transform="scale(0.85)"/>
    <circle cx="3.4" cy="17" r="1.7" fill="#ffffff" stroke="none"/>
  </g>
  <text x="100" y="72" fill="#12141a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" letter-spacing="-0.03em">Perfect Payroll</text>

  <!-- Headline -->
  <text x="48" y="138" fill="#12141a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.04em">Complicated pay.</text>
  <text x="48" y="174" fill="#12141a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.04em">Simple payroll.</text>
  <text x="48" y="208" fill="#3c4250" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="-0.01em">Your pre-payroll assistant.</text>

  <!-- Workflow -->
  <g filter="url(#pp-soft)">
    <rect x="48" y="232" width="292" height="52" rx="14" fill="#ffffff" fill-opacity="0.92" stroke="#d5dbe6" stroke-width="1"/>
  </g>
  <rect x="64" y="246" width="44" height="24" rx="7" fill="#f4f7fb" stroke="#e6e8ee"/>
  <text x="72" y="262" fill="#3c4250" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">QBT</text>
  <text x="136" y="262" fill="#9ca3af" font-size="14">→</text>
  <rect x="154" y="246" width="44" height="24" rx="7" fill="#2563eb"/>
  <text x="162" y="262" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">PP</text>
  <text x="218" y="262" fill="#9ca3af" font-size="14">→</text>
  <rect x="236" y="246" width="44" height="24" rx="7" fill="#f4f7fb" stroke="#e6e8ee"/>
  <text x="242" y="262" fill="#3c4250" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Pay</text>
  <text x="64" y="294" fill="#6b7280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Export · Review · Run</text>

  <!-- Stat chip -->
  <g filter="url(#pp-soft)">
    <rect x="48" y="318" width="168" height="88" rx="16" fill="#ffffff" fill-opacity="0.94" stroke="#d5dbe6" stroke-width="1"/>
  </g>
  <text x="68" y="348" fill="#6b7280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500">Period bonuses</text>
  <text x="68" y="382" fill="#12141a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.03em">$416.25</text>

  <!-- Qualified chip -->
  <rect x="232" y="358" width="108" height="48" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <circle cx="256" cy="382" r="6" fill="#10b981"/>
  <text x="272" y="387" fill="#047857" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">2 qualified</text>

