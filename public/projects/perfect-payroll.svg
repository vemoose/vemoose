    <ellipse cx="94" cy="122" rx="8" ry="11" fill="#172b4c"/>
    <ellipse cx="146" cy="122" rx="8" ry="11" fill="#172b4c"/>
    <path d="M-9 -2 Q0 7 9 -2" transform="translate(120 148)" stroke="#172b4c" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Peel chat bubble -->
  <g filter="url(#pp-soft)">
    <path d="M472 418h248a16 16 0 0 0 16-16V356a16 16 0 0 0-16-16H472a16 16 0 0 0-16 16v46a16 16 0 0 0 16 16z" fill="#ffffff" fill-opacity="0.95" stroke="#d5dbe6"/>
    <path d="M508 418l-12 14v-14z" fill="#ffffff" stroke="#d5dbe6" stroke-linejoin="round"/>
  </g>
  <text x="492" y="384" fill="#12141a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="-0.02em">Ready to review bonus requirements?</text>
  <rect x="492" y="396" width="128" height="28" rx="8" fill="#e8f0fe"/>
  <text x="504" y="415" fill="#2563eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Review requirements</text>
</svg>